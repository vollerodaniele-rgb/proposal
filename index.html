<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>NOIR AU NOIR</title>
<script>
  // Proposals moved into the clients site. Anything that was sent as
  // proposal.noiraunoir.com/<slug>/ still lands in the right place.
  var parts = location.pathname.split("/").filter(Boolean);
  var slug = parts[parts.length - 1] || "";
  location.replace("https://clients.noiraunoir.com" + (slug ? "/p/" + slug + "/" : "/"));
</script>
<style>
  html,body{height:100%;margin:0;background:#000;color:#9a9a9a;
    font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;}
  p{font-size:12px;letter-spacing:.34em;text-transform:uppercase;}
</style>
</head>
<body><p>Noir au Noir</p></body>
</html>
